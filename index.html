/** A separate, local-first listening course; no changes to reading review IDs. */
function createListeningFeature({ getState, getUi, saveState, render, speak, notify, h, icon, today, addDays }) {
  const cards = Object.fromEntries(listeningCards.map(card => [card.id, card]));
  const issues = {
    A: 'A · 选项 / 单词不认识',
    B: 'B · 听到声音认不出来',
    C: 'C · 整句话理解不了',
    D: 'D · 没识别到同义替换',
  };
  const modeName = { visual:'看词识别', audio:'英音听辨', sentence:'整句替换' };
  const modes = Object.keys(modeName);
  const data = () => {
    const state = getState();
    if (!state.listening) state.listening = { progress:{}, attempts:[], journal:[], active:null };
    return state.listening;
  };
  const ui = () => getUi();
  const key = (mode, id) => `${mode}:${id}`;
  const answered = () => data().active?.answer ?? null;
  const session = () => data().active;
  const currentItem = () => session()?.items[session()?.cursor];
  const cardFor = item => item ? cards[item.id] : null;
  const optionValues = card => {
    const candidates = listeningCards.filter(x => x.id !== card.id && x.pair !== card.pair);
    const first = candidates[(card.id * 7) % candidates.length];
    const second = candidates[(card.id * 13 + 3) % candidates.length];
    const third = first.id === second.id ? candidates[(card.id * 13 + 4) % candidates.length] : second;
    const items = [card.pair, first.pair, third.pair];
    return [items[card.id % 3], items[(card.id + 1) % 3], items[(card.id + 2) % 3]];
  };
  const summary = () => {
    const d = data();
    const attempts = d.attempts.length;
    const independent = d.attempts.filter(x => x.correct && !x.assisted).length;
    const due = Object.values(d.progress).filter(x => x.nextReviewAt <= today()).length;
    const seen = new Set(d.attempts.map(x => x.id)).size;
    return { attempts, independent, due, seen };
  };

  function start(mode, weak = false) {
    if (!modes.includes(mode)) return;
    const d = data();
    const candidates = listeningCards.map(card => {
      const progress = d.progress[key(mode, card.id)];
      const rating = !progress ? 1 : progress.nextReviewAt <= today() ? 0 : 2;
      return {card, progress, rating};
    }).filter(x => !weak || (x.progress && (x.progress.streak < 3 || x.progress.nextReviewAt <= today())));
    candidates.sort((a,b) => a.rating - b.rating || (a.progress?.nextReviewAt||'').localeCompare(b.progress?.nextReviewAt||'') || a.card.id - b.card.id);
    if (!candidates.length) { notify('当前没有待复习的听力关系，试试其他训练模式。'); return; }
    const items = candidates.slice(0, 10).map(({card,progress},i) => ({
      id: card.id,
      matches: mode === 'visual' ? true : ((i + (progress?.attempts || 0)) % 3 !== 2),
    }));
    d.active = { mode, items, cursor:0, correctCount:0, independentCount:0, answer:null, weak };
    ui().listeningTab = 'practice';
    ui().listenTranscript = false;
    saveState(); render(); window.scrollTo(0,0);
  }

  function answer(choice) {
    const d = data(), s = d.active, item = currentItem();
    if (!s || !item || s.answer) return;
    const card = cardFor(item);
    const correct = s.mode === 'visual' ? choice === card.pair : choice === (item.matches ? 'yes' : 'no');
    const assisted = !!ui().listenTranscript;
    const k = key(s.mode, card.id);
    const previous = d.progress[k] || {attempts:0, streak:0, wrongReasons:[]};
    const streak = correct && !assisted ? previous.streak + 1 : 0;
    const nextReviewAt = addDays(today(), streak >= 3 ? 7 : streak === 2 ? 3 : streak === 1 ? 1 : 0);
    const progress = {...previous, attempts:previous.attempts+1, streak, nextReviewAt, lastCorrect:correct && !assisted};
    d.progress[k] = progress;
    const result = {id:card.id, mode:s.mode, date:today(), correct, assisted, choice, issue:null};
    d.attempts.push(result);
    s.answer = result;
    if (correct) s.correctCount++;
    if (correct && !assisted) s.independentCount++;
    saveState(); render();
  }

  function chooseIssue(code) {
    const d = data(), s = d.active;
    if (!s?.answer || !issues[code]) return;
    s.answer.issue = code;
    const recorded = d.attempts.at(-1);
    if (recorded?.id === s.answer.id && recorded?.mode === s.mode) recorded.issue = code;
    const k = key(s.mode, s.answer.id);
    const p = d.progress[k];
    p.wrongReasons = [...(p.wrongReasons||[]), code].slice(-12);
    saveState(); render();
  }

  function next() {
    const d = data(), s = d.active;
    if (!s?.answer) return;
    s.cursor++;
    s.answer = null;
    ui().listenTranscript = false;
    if (s.cursor >= s.items.length) {
      ui().listeningReport = {mode:s.mode, total:s.items.length, correct:s.correctCount, independent:s.independentCount};
      d.active = null;
      ui().listeningTab = 'report';
    }
    saveState(); render(); window.scrollTo(0,0);
  }

  function title() {
    return `<div class="listening-title"><div><div class="eyebrow">LISTENING · PARAPHRASE</div><h1 class="page-title">听见另一种说法 🎧</h1><p class="page-sub">听音辨词、理解整句、识别替换，慢慢练到反应更快。</p></div><span class="listening-tag">独立听力进度</span></div>`;
  }
  function tabs() {
    const active = ui().listeningTab || 'home';
    return `<div class="listening-tabs" role="navigation" aria-label="听力模块">
       ${[['home','学习首页'],['catalog','197组资料'],['journal','剑雅复盘']].map(([id,label]) => `<button type="button" class="listening-tab ${id===active?'selected':''}" data-action="listen-tab" data-tab="${id}">${label}</button>`).join('')}
     </div>`;
  }

  function home() {
    const m = summary();
    const three = [
      {mode:'visual',emoji:'👀',label:'看词识别',desc:'先认清两种表达的共同意思。',footer:'从文字建立替换关系'},
      {mode:'audio',emoji:'🎧',label:'英音听辨',desc:'看见题目关键词，听录音判断是否对应。',footer:'听不清可以先看原文'},
      {mode:'sentence',emoji:'🧠',label:'整句替换',desc:'听懂完整句子的含义，注意否定与反转。',footer:'对照逐句释义进行复盘'},
    ];
    const paused = data().active;
    return `${title()}${tabs()}
      ${paused?`<section class="listening-resume"><div><b>上次的训练还在</b><span>${modeName[paused.mode]} · 已完成 ${paused.cursor} / ${paused.items.length} 题</span></div><button class="btn btn-outline" data-action="listen-resume">继续上次训练 ${icon('arrow')}</button></section>`:''}
      <div class="listening-hero"><div><span class="listening-kicker">THE DAILY 20-MINUTE ROUTINE</span><h2>不用背完197组，<br>今天先听懂10组。</h2><p>先从看词开始，再练声音，最后放进整句。每次只做10题，错题会回来找你。</p></div><div class="listening-hero-icon" aria-hidden="true">♫</div></div>
      <div class="listening-metrics"><div><strong>${listeningSourceRows.length}</strong><span>原资料条目</span></div><div><strong>${listeningCards.length}</strong><span>已编写训练组</span></div><div><strong>${m.seen}</strong><span>接触过的组</span></div><div><strong>${m.due}</strong><span>待复习的模式·词组</span></div></div>
      <div class="listening-path">${three.map((step,index) => `<section class="listening-path-card"><div class="listening-step">STEP 0${index+1}</div><div class="listening-emoji" aria-hidden="true">${step.emoji}</div><h3>${step.label}</h3><p>${step.desc}</p><small>${step.footer}</small><button class="btn btn-primary" data-action="listen-start" data-mode="${step.mode}">开始10题 ${icon('arrow')}</button></section>`).join('')}</div>
      <section class="listening-bottom panel"><div><h3>👂 错题有四种原因</h3><p>不认识单词 / 认不出声音 / 没听懂整句 / 没识别替换。答错后标记原因，下次练习才能针对真正的问题。</p></div><button class="btn btn-outline" data-action="listen-review">复习薄弱关系 ${icon('rotate')}</button></section>
      <div class="listening-quality"><b>资料审校说明</b> · 原 PDF 197 条已分为「可对应 / 需看语境 / 存在明显问题」。其中 ${listeningSourceRows.filter(x=>x.status==='caution').length} 条有特别警告。训练题只从保守筛选的词组制作，例句均为原创，<b>不是剑雅录音</b>；正式剑雅请通过「剑雅复盘」记录。</div>`;
  }

  function question() {
    const s = session(), item = currentItem(), card = cardFor(item);
    if (!s || !card) return home();
    const result = answered(), audioLine = item.matches ? card.heard : card.contrast;
    const visual = s.mode === 'visual';
    const shownText = result || ui().listenTranscript;
    const choices = visual ? optionValues(card).map(choice => ({value:choice,label:choice})) : [
      {value:'yes',label:'表达了相同的意思'},
      {value:'no',label:'意思不一致'},
      {value:'unsure',label:'我没听懂 / 不确定'},
    ];
    return `${title()}<div class="listening-question-top"><button class="text-btn" data-action="listen-exit">${icon('back')} 回到听力首页</button><span class="listening-mode-pill">${modeName[s.mode]} · 第 ${s.cursor+1} / ${s.items.length} 题</span></div>
      <div class="listening-meter"><span style="width:${Math.round(s.cursor/s.items.length*100)}%"></span></div>
      <section class="listening-question-card"><div class="listening-question-label">${visual?'找出与这个表达对应的词组':s.mode==='audio'?'题目里可能出现的表达':'题目表达 · 先读懂，再听录音'}</div>
       ${visual ? `<h2 class="listening-key">${h(card.key)}</h2><p class="listening-sub">${h(card.topic)} · 请选择下面意思相近的表达</p>` : s.mode==='audio' ? `<h2 class="listening-key">${h(card.key)}</h2><p class="listening-sub">先看这个词组，再听下面的句子是否表达了相同意思。</p>` : `<h2 class="listening-stem">${h(card.stem)}</h2><p class="listening-sub">听音时抓住整句意思，特别注意否定、时间与数量。</p>`}
       ${!visual ? `<div class="listening-audio"><button class="listening-play" data-action="listen-play" aria-label="播放英音例句">${icon('volume')}</button><div><strong>英音朗读 · 听一遍再判断</strong><span>浏览器可用的英音语音；这是原创教学句子</span></div><button class="listening-replay" data-action="listen-play">重听</button></div>
         <div class="listening-transcript">${shownText ? `<span>${h(audioLine)}</span>` : '<span>录音文字暂时隐藏，允许需要时对照原文。</span>'}${!result&&!ui().listenTranscript?`<button data-action="listen-transcript">看原文辅助</button>`:''}</div>` : ''}
       <div class="listening-question-label" style="margin-top:24px">${visual?'选择正确替换':'这段录音与题目是否对应？'}</div>

        return `<button class="listening-option ${style}" data-action="listen-answer" data-choice="${h(choice.value)}" ${result?'disabled':''}><span class="listen-option-circle">${result&&isCorrect?'✓':chosen?'•':''}</span>${h(choice.label)}</button>`;
       }).join('')}</div>
       ${result ? `<div class="listening-feedback ${result.correct?'right':'wrong'}"><div class="listening-feedback-title">${result.correct?(result.assisted?'🟡 辅助后答对':'✅ 识别正确'):'🌱 这组留给下次再练'}</div>
        <p><b>${h(card.key)}</b> ≈ <b>${h(card.pair)}</b></p><p>${h(card.explain)}</p>

  }

  function onAction(el) {
    const action = el.dataset.action;
    if (!action?.startsWith('listen-')) return false;
    if (action==='listen-tab') { data().active=null; ui().listeningTab=el.dataset.tab; saveState(); render(); window.scrollTo(0,0); }
    else if (action==='listen-resume') {ui().listeningTab='practice';render();}

    else if (action==='listen-review') start('audio',true);
    else if (action==='listen-exit') { data().active=null; ui().listeningTab='home'; saveState(); render(); }
    else if (action==='listen-play') {const s=session(), item=currentItem(), card=cardFor(item); if(card) speak(s.mode==='visual'?card.heard:(item.matches?card.heard:card.contrast));}
    else if (action==='listen-transcript') { ui().listenTranscript=true; render(); }
    else if (action==='listen-answer') answer(el.dataset.choice);

    else if (action==='listen-next') next();
    else if (action==='listen-filter') { ui().listeningFilter=el.dataset.filter; render(); }
    else if (action==='listen-remove-journal') {
      if (!confirm('确定删除这一条剑雅复盘吗？')) return true;
      data().journal=data().journal.filter(x=>String(x.id)!==el.dataset.id); saveState(); render();
    }
    return true;
  }

  function onInput(el) {
    if(el.id!=='listening-search')return false;
    const pos=el.selectionStart;
    ui().listeningSearch=el.value; render();
    const input=document.getElementById('listening-search');
    input?.focus(); if(pos!=null)input?.setSelectionRange(pos,pos);
    return true;
  }

  function onSubmit(event) {
    if(event.target.id!=='listening-journal-form')return false;

    if(!entry.reference||!entry.prompt||!entry.audio) {notify('请先填完出处、题目表达和录音表达。');return true;}
    data().journal.push(entry); saveState(); render(); notify('已保存这条剑雅真题复盘。');
    return true;
  }
  return {view,onAction,onInput,onSubmit,summary};
}

 if(!review||review.streak<3)return false;

 // Pre-upgrade saves may not yet have relationId or uniqueCorrectDates.
 if(questionCount>=2||!review.relationId)return new Set(review.uniqueCorrectQuestionIds||[]).size>=2;
 // Single-context practice needs successes on at least three different days.

}

function passageInfo(q){
 const start=q.passage.indexOf('[[');
 const close=q.passage.indexOf(']]',start+2);
 const text=q.passage.slice(0,start)+q.passage.slice(start+2,close)+q.passage.slice(close+2);
 const answerStart=start;
 const answerEnd=start+close-(start+2);
 const coreStart=text.indexOf(q.matchTerm,answerStart);
 const coreEnd=coreStart+q.matchTerm.length;
 if(coreStart<answerStart||coreEnd>answerEnd)throw Error(`Invalid core match: ${q.id}`);
 return {text,answerStart,answerEnd,coreStart,coreEnd};
}
function isSelectionCorrect(q,range){

}
function passageMarkup(q,reveal,selection){
 const info=passageInfo(q);
 const cuts=new Set([0,info.text.length]);
 if(reveal){cuts.add(info.answerStart);cuts.add(info.answerEnd);}
 if(selection){cuts.add(selection.start);cuts.add(selection.end);}

 let html='';
 for(let i=0;i<sorted.length-1;i++){
  const start=sorted[i],end=sorted[i+1];
  if(end<=start)continue;

function render(){let content=ui.page==='home'?renderHome():ui.page==='quiz'?renderQuiz():ui.page==='report'?renderReport():ui.page==='library'?renderLibrary():ui.page==='listening'?listeningFeature.view():renderStats();app.innerHTML=layoutWithListening(content);}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function notify(message){ui.toast=message;render();setTimeout(()=>{if(ui.toast===message){ui.toast='';render();}},2800);}
// Chrome provides Google UK English voices on some platforms. Use them by default,
// then prefer another British voice; never silently select Google US English over UK English.
function chooseBritishVoice(voices){
 const british=v=>/^en[-_]gb(?:$|[-_])/i.test(v.lang||'')||/\b(english|en)[ -]?(uk|british)\b/i.test(v.name||'');
 const google=v=>/google/i.test(v.name||'');
 return voices.find(v=>google(v)&&british(v))
     ||voices.find(british)
     ||voices.find(v=>google(v)&&/^en(?:$|[-_])/i.test(v.lang||''))
     ||voices.find(v=>/^en(?:$|[-_])/i.test(v.lang||''))
     ||null;
}
let speechRequestId=0;
function speak(word){
 const synth=window.speechSynthesis;
 if(!synth||typeof window.SpeechSynthesisUtterance!=='function'){
   notify('当前浏览器不支持语音朗读。');return;
 }
 const requestId=++speechRequestId;
 synth.cancel();
 function play(){
   if(requestId!==speechRequestId)return;
   const utterance=new window.SpeechSynthesisUtterance(word);
   utterance.lang='en-GB';
   utterance.rate=.88;
   const voice=chooseBritishVoice(synth.getVoices());
   if(voice)utterance.voice=voice;
   synth.speak(utterance);
 }
 // Voice lists sometimes arrive asynchronously when a browser first opens a page.
 if(synth.getVoices().length){play();return;}
 if(typeof synth.addEventListener!=='function'){play();return;}
 let completed=false;
 const onVoicesChanged=()=>{
   if(!synth.getVoices().length||completed)return;
   completed=true;
   synth.removeEventListener('voiceschanged',onVoicesChanged);
   play();
 };
 synth.addEventListener('voiceschanged',onVoicesChanged);
 setTimeout(()=>{
   if(completed)return;
   completed=true;
   synth.removeEventListener('voiceschanged',onVoicesChanged);
   play();
 },500);
}
function exportState(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`paraphrase-radar-progress-${today()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function importState(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(data.version!==VERSION||!data.reviews||!Array.isArray(data.attempts)||!data.dailyCompleted||!Array.isArray(data.bookmarks))throw Error('bad backup');if(!confirm('导入将覆盖当前浏览器的学习记录，确定继续吗？'))return;state={...defaultState(),...data};state.activeSession=null;ui.page='home';saveState();render();notify('学习进度导入成功。');}catch{notify('文件不是有效的换词雷达学习进度备份。');}};r.readAsText(file);}
function renderAfterPage(page){ui.drawer=null;ui.worksDrawer=false;if(page==='quiz'){if(session()&&!session().finished){restoreDraft();ui.page='quiz';render();scrollTop();}else startDaily();return;}ui.page=page;render();scrollTop();}
app.addEventListener('click',(e)=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(listeningFeature.onAction(el))return;
 if(action==='open-works'){ui.drawer=null;ui.worksDrawer=true;render();document.querySelector('.works-panel')?.focus();return;}
 if(action==='close-works'){ui.worksDrawer=false;render();return;}
 if(action==='close-works-backdrop'){if(e.target===el){ui.worksDrawer=false;render();}return;}
 if(action==='close-drawer-backdrop'){if(e.target===el){ui.drawer=null;render();}return;}
 if(action==='nav'){renderAfterPage(el.dataset.page);return;}
 if(action==='start-daily'){startDaily();return;}
 if(action==='leave'){ui.page='home';restoreDraft();render();return;}
 if(action==='reveal'){ui.selected=null;ui.revealed=true;submitAnswer('skip',false);return;}
 if(action==='check-selection'){checkPassageSelection();return;}
 if(action==='clear-selection'){ui.selected=null;window.getSelection?.()?.removeAllRanges();render();return;}
 if(action==='hint'){ui.hinted=true;render();return;}
 if(action==='next'){nextQuestion();return;}
 if(action==='alt-detail'){const scope=`${el.dataset.relation}:${el.dataset.qid||'library'}`;const word=el.dataset.word;ui.openedAlt=ui.openedAlt?.scope===scope&&ui.openedAlt.word===word?null:{scope,word};const oldScroll=window.scrollY||0;render();window.scrollTo(0,oldScroll);return;}
 if(action==='toggle-translation'){ui.showTranslation=!ui.showTranslation;render();return;}
 if(action==='bookmark'){let id=el.dataset.id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];saveState();render();return;}
 if(action==='filter'){ui.libraryFilter=el.dataset.filter;render();return;}
 if(action==='toggle-index'){ui.showAllWords=!ui.showAllWords;render();return;}
 if(action==='detail'){ui.drawer=el.dataset.id;render();return;}
 if(action==='close-drawer'){ui.drawer=null;render();return;}
 if(action==='speak'){speak(el.dataset.word);return;}
 if(action==='review-weak'){startReview(el.dataset.ids.split(','));return;}
 if(action==='practice-word'){const id=el.dataset.id;ui.drawer=null;startReview([id]);return;}
 if(action==='export'){exportState();return;}
 if(action==='import'){document.getElementById('import-file')?.click();return;}
 if(action==='reset'){if(!confirm('确定清空本浏览器所有练习记录吗？此操作无法撤销，建议先导出备份。'))return;state=defaultState();ui.page='home';saveState();render();notify('学习记录已重置。');return;}
});

// Native Range selection: capture offsets after the drag, then rerender a durable highlight.
app.addEventListener('mouseup',(e)=>{if(e.target.closest?.('#reading-passage'))capturePassageSelection();});
app.addEventListener('touchend',(e)=>{if(e.target.closest?.('#reading-passage'))setTimeout(capturePassageSelection,70);},{passive:true});
app.addEventListener('keyup',(e)=>{if(e.target.closest?.('#reading-passage'))capturePassageSelection();});
app.addEventListener('input',(e)=>{if(listeningFeature.onInput(e.target))return;if(e.target.id==='library-search'){const v=e.target.value;const pos=e.target.selectionStart;ui.libraryQuery=v;render();const input=document.getElementById('library-search');input?.focus();if(pos!==null)input?.setSelectionRange(pos,pos);}});
app.addEventListener('change',(e)=>{if(e.target.id==='import-file'){importState(e.target.files[0]);}});
app.addEventListener('submit',(e)=>{listeningFeature.onSubmit(e);});
app.addEventListener('keydown',(e)=>{if(e.key==='Escape' && ui.worksDrawer){ui.worksDrawer=false;render();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.ghost-word.on')){e.preventDefault();ui.drawer=e.target.dataset.id;render();}});
(async()=>{state=await loadState();if(state.activeSession?.finished)state.activeSession=null;render();})();

</script>
